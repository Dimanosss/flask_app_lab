{% macro render_field(field) %}
  <div class="form-row">
    {{ field.label }}
    {{ field(class_='input') }}
    {% if field.name != 'csrf_token' and field.errors %}
      <ul class="errors">
        {% for error in field.errors %}
          <li>{{ error }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  </div>
{% endmacro %}
