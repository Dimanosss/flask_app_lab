{% extends 'base.html' %}

{% block content %}
<div class="row">
    <div class="col-md-10">
        <p class="mb-2">
            <a href="{{ url_for('index') }}">Головна</a> / 
            <a href="{{ url_for('products.list_products') }}">Продукти</a> / 
            {{ product.name }}
        </p>

        <div class="card">
            <div class="card-body">
                <h1 class="mb-3">{{ product.name }}</h1>
                <p>{{ product.description }}</p>
                
                <h5>Характеристики:</h5>
                <p>{{ product.specs }}</p>
                
                <p><strong>Ціна: {{ product.price }} грн</strong></p>
                
                <a href="{{ url_for('products.list_products') }}" class="btn btn-secondary">
                    Назад до списку
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
